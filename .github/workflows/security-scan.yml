name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety pip-audit
      
      - name: Run Bandit (Python security linter)
        run: |
          bandit -r core/ Commercial/ tests/ -f json -o bandit-report.json || true
          bandit -r core/ Commercial/ tests/ -ll -ii
        continue-on-error: true
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check --json --output safety-report.json || true
          safety check
        continue-on-error: true
      
      - name: Run pip-audit (Python dependency audit)
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true
      
      # Blocking filesystem scan: catches any secret committed to the tree.
      # Runs the pinned TruffleHog release directly in filesystem mode, so the
      # scan can never silently become a git-history or diff scan on scheduled
      # runs (base/head SHAs are unreliable across push, PR, and schedule
      # triggers). Pinned to v3.97.9 (reviewed) instead of @main.
      # --only-verified keeps the gate blocking on live secrets without
      # flaking on placeholders.
      - name: Install TruffleHog v3.97.9
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_amd64.tar.gz -o /tmp/trufflehog.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          chmod +x /tmp/trufflehog
          /tmp/trufflehog --version

      - name: Scan for secrets (filesystem)
        run: /tmp/trufflehog filesystem --directory=. --only-verified --fail
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
      
      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔒 Security Scan Results\n\n';
            
            try {
              const bandit = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const highSeverity = bandit.results.filter(r => r.issue_severity === 'HIGH').length;
              const mediumSeverity = bandit.results.filter(r => r.issue_severity === 'MEDIUM').length;
              
              comment += `**Bandit (Code Security)**\n`;
              comment += `- High: ${highSeverity}\n`;
              comment += `- Medium: ${mediumSeverity}\n\n`;
            } catch (e) {
              comment += '**Bandit:** Could not parse report\n\n';
            }
            
            comment += '📄 Full reports available in workflow artifacts.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
