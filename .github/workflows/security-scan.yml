name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety pip-audit
      
      - name: Run Bandit (Python security linter)
        run: |
          bandit -r core/ Commercial/ tests/ -f json -o bandit-report.json || true
          bandit -r core/ Commercial/ tests/ -ll -ii
        continue-on-error: true
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check --json --output safety-report.json || true
          safety check
        continue-on-error: true
      
      - name: Run pip-audit (Python dependency audit)
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true
      
      # Advisory until the committed sk_pilot_ key is rotated and purged
      # from history — then remove continue-on-error to make this blocking.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
      
      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔒 Security Scan Results\n\n';
            
            try {
              const bandit = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const highSeverity = bandit.results.filter(r => r.issue_severity === 'HIGH').length;
              const mediumSeverity = bandit.results.filter(r => r.issue_severity === 'MEDIUM').length;
              
              comment += `**Bandit (Code Security)**\n`;
              comment += `- High: ${highSeverity}\n`;
              comment += `- Medium: ${mediumSeverity}\n\n`;
            } catch (e) {
              comment += '**Bandit:** Could not parse report\n\n';
            }
            
            comment += '📄 Full reports available in workflow artifacts.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
